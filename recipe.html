<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>오늘 뭐 해먹지? - 초보자 레시피 추천</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', '맑은 고딕', sans-serif;
    background: #fff8f0;
    min-height: 100vh;
    padding: 40px 20px;
    color: #3a3a3a;
    line-height: 1.6;
  }
  .container { max-width: 860px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 36px; }
  h1 {
    font-size: 2.1em;
    color: #e87c5a;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .subtitle { color: #999; font-size: 1em; }

  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .card h2 {
    font-size: 1.15em;
    color: #4a4a4a;
    margin-bottom: 18px;
    font-weight: 600;
  }

  .category-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .tab {
    padding: 8px 14px;
    background: #fdf3ec;
    border: 1.5px solid transparent;
    border-radius: 22px;
    cursor: pointer;
    font-size: 0.92em;
    color: #8a7060;
    transition: all 0.15s;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .tab:hover { background: #fae5d6; }
  .tab.active {
    background: #e87c5a;
    color: white;
    border-color: #e87c5a;
  }

  .ingredient-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
    margin-bottom: 22px;
  }
  .ingredient-item {
    background: #fdf8f3;
    border: 1.5px solid #f0e3d4;
    border-radius: 12px;
    padding: 14px 8px 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    font-size: 0.92em;
    color: #5a5a5a;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .ingredient-item:hover {
    border-color: #e87c5a;
    background: #fff5ed;
    transform: translateY(-2px);
  }
  .ingredient-item.selected {
    background: #ffe7d6;
    border-color: #e87c5a;
    color: #b04a2a;
    font-weight: 600;
  }
  .ingredient-icon { font-size: 1.6em; line-height: 1; }

  .custom-input {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
  }
  .custom-input input {
    flex: 1;
    padding: 11px 16px;
    border: 1.5px solid #f0e3d4;
    border-radius: 10px;
    font-size: 0.95em;
    outline: none;
    font-family: inherit;
    background: #fdf8f3;
    color: #3a3a3a;
  }
  .custom-input input:focus {
    border-color: #e87c5a;
    background: #fff;
  }

  .btn {
    padding: 11px 20px;
    background: #e87c5a;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 0.95em;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.15s;
    font-family: inherit;
  }
  .btn:hover { background: #d96a48; }
  .btn-big {
    display: block;
    width: 100%;
    padding: 16px;
    font-size: 1.08em;
    font-weight: 700;
    margin-bottom: 28px;
    box-shadow: 0 4px 14px rgba(232, 124, 90, 0.25);
  }

  .selected-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .selected-count { font-size: 0.9em; color: #888; font-weight: 500; }
  .clear-btn {
    padding: 6px 12px;
    font-size: 0.85em;
    background: transparent;
    border: 1px solid #d4cabd;
    color: #8a7e6e;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .clear-btn:hover { background: #faf0e6; border-color: #b89a82; }
  .clear-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .selected-list {
    background: #fdf8f3;
    border: 1.5px dashed #d4c4b3;
    border-radius: 12px;
    padding: 14px;
    min-height: 64px;
  }
  .selected-tag {
    display: inline-flex;
    align-items: center;
    background: #fff;
    color: #5a4a3a;
    padding: 6px 8px 6px 12px;
    border: 1px solid #f0e0d0;
    border-radius: 20px;
    margin: 4px;
    font-size: 0.92em;
    gap: 4px;
  }
  .selected-tag .tag-icon { font-size: 1.1em; }
  .selected-tag .remove {
    margin-left: 6px;
    width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #f0e3d4;
    color: #8a7060;
    border-radius: 50%;
    cursor: pointer;
    font-size: 0.85em;
    transition: all 0.15s;
  }
  .selected-tag .remove:hover { background: #e87c5a; color: white; }
  .empty-message { color: #c0b3a3; text-align: center; padding: 14px; font-size: 0.95em; }

  /* 레시피 카드 */
  .recipe-card {
    background: #fff;
    border: 1.5px solid #f0e3d4;
    border-radius: 16px;
    margin-bottom: 20px;
    overflow: hidden;
    transition: all 0.2s;
  }
  .recipe-card:hover {
    border-color: #e87c5a;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(232, 124, 90, 0.12);
  }

  .recipe-hero {
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 76px;
    position: relative;
    overflow: hidden;
  }
  .recipe-hero::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 30px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.4));
  }
  .hero-1 { background: linear-gradient(135deg, #ffe4cc 0%, #ffcca8 100%); }
  .hero-2 { background: linear-gradient(135deg, #ffe7e3 0%, #ffc4ba 100%); }
  .hero-3 { background: linear-gradient(135deg, #fff4d6 0%, #ffe093 100%); }
  .hero-4 { background: linear-gradient(135deg, #ffdcd0 0%, #ff9d80 100%); }
  .hero-5 { background: linear-gradient(135deg, #ffe5b4 0%, #ffb874 100%); }
  .hero-6 { background: linear-gradient(135deg, #fff0d4 0%, #ffd58a 100%); }
  .hero-7 { background: linear-gradient(135deg, #fff5cc 0%, #ffe17a 100%); }
  .hero-8 { background: linear-gradient(135deg, #e8d5b8 0%, #c49b6a 100%); }
  .hero-9 { background: linear-gradient(135deg, #e6f0d4 0%, #b9d68f 100%); }
  .hero-10 { background: linear-gradient(135deg, #ffe9c5 0%, #ffc274 100%); }
  .hero-11 { background: linear-gradient(135deg, #ffe1d0 0%, #ffaa84 100%); }
  .hero-12 { background: linear-gradient(135deg, #d4ebd4 0%, #94c594 100%); }
  .hero-13 { background: linear-gradient(135deg, #fde8d3 0%, #f5b890 100%); }
  .hero-14 { background: linear-gradient(135deg, #f5e8d8 0%, #e0c8a0 100%); }

  .recipe-body { padding: 24px; }

  .recipe-title {
    font-size: 1.3em;
    color: #2a2a2a;
    margin-bottom: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .recipe-meta {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .meta-tag {
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 0.83em;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .meta-tag.time { background: #e8eef5; color: #4a6890; }
  .meta-tag.match { background: #fde0d4; color: #b04a2a; font-weight: 600; }
  .meta-tag.portion { background: #f0e8db; color: #6a5e4e; }
  .meta-tag.stars {
    background: #fff5dc;
    color: #d4a017;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .star-empty { color: #e8d8a0; }
  .difficulty-label {
    font-size: 0.83em;
    color: #888;
    margin-right: 2px;
  }

  .match-bar {
    background: #f5ebe0;
    border-radius: 4px;
    height: 6px;
    overflow: hidden;
    margin: 10px 0;
  }
  .match-fill {
    height: 100%;
    background: linear-gradient(90deg, #e87c5a, #f4b942);
    border-radius: 4px;
    transition: width 0.5s;
  }
  .ingredient-status { font-size: 0.9em; color: #7a7068; margin: 8px 0; }
  .missing { color: #d97b4a; }
  .all-have { color: #6a9050; font-weight: 500; }

  .recipe-section { margin: 20px 0 8px; }
  .recipe-section .label {
    color: #5a5040;
    font-size: 0.88em;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .recipe-section .label::before {
    content: '';
    width: 4px;
    height: 14px;
    background: #e87c5a;
    border-radius: 2px;
  }
  .recipe-section ol, .recipe-section ul {
    margin-left: 22px;
    line-height: 1.85;
    color: #3a3a3a;
  }
  .recipe-section ol li, .recipe-section ul li {
    padding-left: 6px;
    margin-bottom: 6px;
  }

  .ingredients-table {
    background: #fdf8f3;
    border-radius: 10px;
    padding: 14px 18px;
    border: 1px solid #f0e3d4;
  }
  .ing-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px dashed #f0e3d4;
    font-size: 0.93em;
  }
  .ing-row:last-child { border-bottom: none; }
  .ing-name { color: #4a4a4a; display: flex; align-items: center; gap: 6px; }
  .ing-amount { color: #8a7e6e; font-weight: 500; }

  .tip {
    background: #fffaeb;
    border-left: 3px solid #f4b942;
    padding: 12px 16px;
    border-radius: 6px;
    margin-top: 14px;
    font-size: 0.93em;
    color: #5a5040;
    line-height: 1.7;
  }
  .tip strong { color: #b8881a; }
  .caution {
    background: #fdecec;
    border-left: 3px solid #d96a6a;
    padding: 12px 16px;
    border-radius: 6px;
    margin-top: 10px;
    font-size: 0.93em;
    color: #6b4040;
    line-height: 1.7;
  }
  .caution strong { color: #b03a3a; }

  .empty {
    text-align: center;
    color: #b8ada0;
    padding: 50px 20px;
    font-size: 0.98em;
  }
  .empty small { display: block; margin-top: 8px; font-size: 0.88em; color: #c8bfb2; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🍽 오늘 뭐 해먹지?</h1>
    <p class="subtitle">냉장고 속 재료로 만드는 초보자 맞춤 레시피</p>
  </header>

  <div class="card">
    <h2>1. 갖고 있는 재료를 골라주세요</h2>
    <div class="category-tabs" id="tabs"></div>
    <div class="ingredient-grid" id="ingredients"></div>

    <div class="custom-input">
      <input type="text" id="customIngredient" placeholder="목록에 없는 재료를 직접 입력하세요" />
      <button class="btn" onclick="addCustom()">추가</button>
    </div>

    <div class="selected-header">
      <span class="selected-count" id="selectedCount">선택된 재료 0개</span>
      <button class="clear-btn" id="clearBtn" onclick="clearAll()" disabled>전체 지우기</button>
    </div>
    <div class="selected-list" id="selectedList">
      <div class="empty-message">아직 선택된 재료가 없습니다</div>
    </div>
  </div>

  <button class="btn btn-big" onclick="findRecipes()">레시피 추천받기</button>

  <div class="card">
    <h2>2. 추천 레시피</h2>
    <div id="recipes">
      <div class="empty">
        재료를 선택하고 추천받기 버튼을 눌러주세요
        <small>가지고 있는 재료가 많을수록 더 정확한 추천을 받을 수 있어요</small>
      </div>
    </div>
  </div>
</div>

<script>
// 재료별 아이콘 매핑
const icons = {
  '달걀': '🥚', '돼지고기': '🥩', '소고기': '🥩', '닭고기': '🍗',

  '간장': '🥫', '고추장': '🌶️', '된장': '🥫', '설탕': '🍬',
  '소금': '🧂', '후추': '🌑', '식용유': '🫗', '참기름': '🫗',
  '고춧가루': '🌶️', '마요네즈': '🥫', '케첩': '🍅', '굴소스': '🥫',
  '식초': '🧴', '꿀': '🍯', '김치국물': '🌶️', '다진마늘': '🧄',
  '올리브유': '🫒', '밀가루': '🌾', '부침가루': '🌾', '통깨': '🌰',

  '햄 또는 소시지': '🍖', '토마토 또는 케첩': '🍅',
  '버터 (선택)': '🧈', '치즈 (선택)': '🧀', '대파 (선택)': '🌿',
  '양파 (선택)': '🧅', '당근 (선택)': '🥕', '햄 (선택)': '🍖',
  '버섯 (선택)': '🍄', '돼지고기 (선택)': '🥩', '달걀 (선택)': '🥚',
  '참기름 (선택)': '🫗', '치즈': '🧀', '마요네즈': '🥫',
  '후추 (선택)': '🌑', '소금/후추': '🧂', '소금': '🧂',
  '고추장 (선택)': '🌶️', '꿀 (선택)': '🍯', '시나몬 (선택)': '🌰',
  '밀가루 또는 부침가루 (선택)': '🌾', '통깨 (선택)': '🌰',
  '슈레드치즈': '🧀', '청양고추': '🌶️',
  // 해산물
  '새우': '🦐', '오징어': '🦑', '갈치': '🐟', '고등어': '🐟',
  '문어': '🐙', '조개': '🐚', '대합': '🐚', '멸치': '🐟',

  '사과': '🍎', '바나나': '🍌', '딸기': '🍓', '오렌지': '🍊',
  '레몬': '🍋', '단호박': '🎃', '호도': '🌰', '아몬드': '🥜',
  '잣': '🌰', '건조과일': '🍇',

  '스팸': '🥫', '황도캔': '🥫', '옥수수캔': '🌽', '토마토캔': '🍅', '골뱅이': '🐌'
};

function getIcon(name) {
  if (icons[name]) return icons[name];
  // 부분 매칭
  for (const key of Object.keys(icons)) {
    if (name.includes(key)) return icons[key];
  }
  return '🥄';
}

const ingredientCategories = {
  '🥩 육류·달걀': ['달걀', '돼지고기', '소고기', '닭고기', '베이컨', '햄', '소시지', '참치캔'],
  '🥬 채소': ['양파', '대파', '마늘', '감자', '당근', '애호박', '양배추', '김치', '버섯', '오이', '토마토', '시금치', '깻잎', '두부', '브로콜리', '열무'],

};

// 분량 표시 기준: 1숟갈 = 밥숟가락 1개 (약 15ml)
// 불 세기: 약불(가스 1-2단), 중불(3단), 센불(4-5단)
// difficulty: 1 (쉬움) ~ 3 (어려움), heroEmoji: 완성 요리 이모지
const recipes = [
  {
    name: '간단 계란후라이 덮밥', diff: 1, time: '10분', portions: '1인분',
    heroEmoji: '🍳', heroClass: 'hero-1',
    need: ['달걀', '밥', '간장'], optional: ['참기름', '대파', '버터'],
    ingredients: [
      ['달걀', '2개'], ['밥', '1공기 (약 200g)'], ['간장', '1숟갈'],
      ['식용유', '1숟갈'], ['참기름 (선택)', '몇 방울'], ['대파 (선택)', '5cm 정도']
    ],
    prep: [
      '대파가 있다면 송송 썰어 둡니다 (대파를 옆으로 눕히고 칼로 얇게 자르면 동그란 모양이 나와요)',
      '밥은 미리 전자레인지에 1분 30초 정도 데워두면 좋아요'

const diffLabel = { 1: '쉬움', 2: '보통', 3: '어려움' };

let selected = new Set();
let activeCategory = Object.keys(ingredientCategories)[0];

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = Object.keys(ingredientCategories).map(cat =>
    `<button class="tab ${cat===activeCategory?'active':''}" onclick="switchCategory('${cat}')">${cat}</button>`
  ).join('');
}

function switchCategory(cat) {
  activeCategory = cat;
  renderTabs();
  renderIngredients();
}

function renderIngredients() {
  const grid = document.getElementById('ingredients');
  grid.innerHTML = ingredientCategories[activeCategory].map(ing =>
    `<div class="ingredient-item ${selected.has(ing)?'selected':''}" onclick="toggleIngredient('${ing}')">
      <span class="ingredient-icon">${getIcon(ing)}</span>
      <span>${ing}</span>
    </div>`
  ).join('');
}

function toggleIngredient(ing) {
  if (selected.has(ing)) selected.delete(ing);
  else selected.add(ing);
  renderIngredients();
  renderSelected();
}

function addCustom() {
  const input = document.getElementById('customIngredient');
  const val = input.value.trim();
  if (val) {
    selected.add(val);
    input.value = '';
    renderIngredients();
    renderSelected();
  }
}

document.getElementById('customIngredient').addEventListener('keypress', e => {
  if (e.key === 'Enter') addCustom();
});

function renderSelected() {
  const list = document.getElementById('selectedList');
  const count = document.getElementById('selectedCount');
  const clearBtn = document.getElementById('clearBtn');

  count.textContent = `선택된 재료 ${selected.size}개`;
  clearBtn.disabled = selected.size === 0;

  if (selected.size === 0) {
    list.innerHTML = '<div class="empty-message">아직 선택된 재료가 없습니다</div>';
    return;
  }
  list.innerHTML = [...selected].map(ing =>
    `<span class="selected-tag">
      <span class="tag-icon">${getIcon(ing)}</span>
      <span>${ing}</span>
      <span class="remove" onclick="removeSelected('${ing}')">×</span>
    </span>`
  ).join('');
}

function removeSelected(ing) {
  selected.delete(ing);
  renderSelected();
  renderIngredients();
}

function clearAll() {
  if (selected.size === 0) return;
  if (confirm('선택한 재료를 모두 지울까요?')) {
    selected.clear();
    renderSelected();
    renderIngredients();
  }
}

function difficultyStars(diff) {
  let stars = '';
  for (let i = 1; i <= 3; i++) {
    stars += i <= diff ? '★' : '<span class="star-empty">★</span>';
  }
  return stars;
}

function findRecipes() {
  const container = document.getElementById('recipes');
  if (selected.size === 0) {
    container.innerHTML = '<div class="empty">재료를 먼저 선택해주세요</div>';
    return;
  }

  const scored = recipes.map(r => {
    const have = r.need.filter(n => selected.has(n));
    const missing = r.need.filter(n => !selected.has(n));
    const optHave = r.optional.filter(o => selected.has(o));
    const needScore = have.length / r.need.length;
    const totalScore = needScore * 70 + (optHave.length / r.optional.length) * 30;
    return { ...r, have, missing, optHave, totalScore, needScore };
  }).filter(r => r.needScore >= 0.5)
    .sort((a, b) => b.totalScore - a.totalScore)
    .slice(0, 5);

  if (scored.length === 0) {
    container.innerHTML = `
      <div class="empty">
        선택한 재료로 만들 수 있는 레시피가 부족해요
        <small>달걀, 밥, 양파, 김치 같은 기본 재료를 추가해보세요</small>
      </div>`;
    return;
  }

  container.innerHTML = scored.map(r => {
    const matchPct = Math.round(r.totalScore);
    const allHave = r.have.concat(r.optHave);
    const ingredientsHtml = `
      <div class="recipe-section">
        <div class="label">재료 (${r.portions})</div>
        <div class="ingredients-table">
          ${r.ingredients.map(([n, a]) => `
            <div class="ing-row">
              <span class="ing-name"><span>${getIcon(n)}</span>${n}</span>
              <span class="ing-amount">${a}</span>
            </div>`).join('')}
        </div>
      </div>`;
    const prepHtml = r.prep ? `
      <div class="recipe-section">
        <div class="label">사전 준비</div>
        <ul>${r.prep.map(p => `<li>${p}</li>`).join('')}</ul>
      </div>` : '';
    const cautionHtml = r.caution ? `
      <div class="caution"><strong>⚠️ 주의</strong> · ${r.caution}</div>` : '';

    return `
      <div class="recipe-card">
        <div class="recipe-hero ${r.heroClass}">${r.heroEmoji}</div>
        <div class="recipe-body">
          <div class="recipe-title">${r.name}</div>
          <div class="recipe-meta">
            <span class="difficulty-label">난이도</span>
            <span class="meta-tag stars">${difficultyStars(r.diff)}</span>
            <span class="meta-tag time">⏱ ${r.time}</span>
            <span class="meta-tag portion">👥 ${r.portions}</span>
            <span class="meta-tag match">✓ 매칭률 ${matchPct}%</span>
          </div>
          <div class="match-bar"><div class="match-fill" style="width:${matchPct}%"></div></div>
          <div class="ingredient-status">보유 재료: ${allHave.map(n => getIcon(n)+' '+n).join(', ') || '없음'}</div>
          ${r.missing.length
            ? `<div class="ingredient-status missing">추가로 필요한 재료: ${r.missing.map(n => getIcon(n)+' '+n).join(', ')}</div>`
            : `<div class="ingredient-status all-have">필수 재료를 모두 갖고 계세요!</div>`}

          ${ingredientsHtml}
          ${prepHtml}

          <div class="recipe-section">
            <div class="label">만드는 법</div>
            <ol>${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>
          </div>

          <div class="tip"><strong>💡 꿀팁</strong> · ${r.tip}</div>
          ${cautionHtml}
        </div>
      </div>
    `;
  }).join('');

  container.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

renderTabs();
renderIngredients();
renderSelected();
</script>
</body>
</html>
